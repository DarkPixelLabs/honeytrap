name: build
on:
  push:
  pull_request:
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B test package
      - name: Acceptance smoke test
        shell: bash
        run: |
          set -euo pipefail
          nohup java -jar target/honeytrap-0.0.1-SNAPSHOT.jar >/tmp/honeytrap.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/honeytrap.log; exit 1; fi
          curl -fsS http://127.0.0.1:8080/.env -A 'acceptance-agent-a' >/dev/null
          curl -fsS -X POST http://127.0.0.1:8080/admin/login -d 'username=fake&password=fake' -A 'acceptance-agent-b' >/dev/null
          curl -fsS http://127.0.0.1:8080/wp-login.php -A '<script>alert(1)</script>' >/dev/null
          curl -fsS http://127.0.0.1:8080/.git/config -A 'acceptance-agent-c' >/dev/null
          curl -fsS http://127.0.0.1:8080/phpmyadmin/ -A 'acceptance-agent-d' >/dev/null
          curl -fsS http://127.0.0.1:8080/api/stats/summary >/tmp/summary.json
          grep -q '"totalHits":5' /tmp/summary.json
          curl -fsS 'http://127.0.0.1:8080/api/hits?page=0&size=10' >/tmp/hits.json
          grep -q 'acceptance-agent' /tmp/hits.json
          grep -q 'textContent' src/main/resources/static/app.js
          grep -q '@Scheduled' src/main/java/com/darkpixellabs/honeytrap/service/HitLoggingService.java
          curl -fsS http://127.0.0.1:8080/ >/tmp/dashboard.html
          grep -q 'HONEYTRAP' /tmp/dashboard.html
      - name: Docker build
        run: docker build -t honeytrap:ci .
