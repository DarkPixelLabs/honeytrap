spring.application.name=honeytrap
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/honeytrap;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
honeytrap.retention.max-hits=${HONEYTRAP_RETENTION_MAX_HITS:50000}
honeytrap.retention.prune-delay-ms=${HONEYTRAP_RETENTION_PRUNE_DELAY_MS:3600000}
# Disabled for local development. REQUIRED before public deployment.
honeytrap.api-key.enabled=${HONEYTRAP_API_KEY_ENABLED:false}
honeytrap.api-key.value=${HONEYTRAP_API_KEY:}
